[tools]
python = "3.11"

[env]
# El paquete de la tesis vive en el repo hermano. Si lo movés, cambiá esto.
REPO_TESIS = "../repo-rebuild"

[tasks.venv]
description = "Crea el entorno virtual en repo-web/.venv"
run = "python -m venv .venv"

[tasks.install]
description = "Instala dependencias del taller + el paquete `tesis` desde el repo hermano"
run = """
./.venv/bin/python -m pip install --upgrade pip
./.venv/bin/python -m pip install -r requirements.txt
./.venv/bin/python -m pip install -e $REPO_TESIS
"""

[tasks.datos]
description = "Precalcula la tabla cruda leyendo el Excel una sola vez (~36 s)"
run = "./.venv/bin/python scripts/exportar_crudo.py"

[tasks.dev]
description = "Levanta el taller en http://localhost:8000 con recarga automática"
run = "./.venv/bin/python -m uvicorn backend.main:app --reload --port 8000"

[tasks.servir]
description = "Levanta el taller sin recarga (uso normal)"
run = "./.venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"

[tasks.check]
description = "Verifica que el paquete de la tesis sea importable y con qué commit"
run = """
./.venv/bin/python -c "import tesis, sys; print(sys.executable); print('tesis', tesis.__version__)"
"""

[tasks.limpiar]
description = "Borra el caché de resultados y el árbol de ejecuciones (no toca los datos crudos)"
run = "rm -rf data/cache data/ejecuciones.sqlite && echo 'caché y árbol borrados'"
